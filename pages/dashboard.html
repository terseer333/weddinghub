<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · WeddingHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="owner-pages.css">
  <script>(function(){var t=null;try{t=localStorage.getItem("weddinghub-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
</head>
<body data-page="dashboard">
  <div id="app-shell"></div>
  <template id="page-template">
        <section class="welcome">
          <div>
            <span class="eyebrow" id="today-date"></span>
            <div role="heading" aria-level="1" class="heading heading-1">Welcome back, <span id="user-first-name">there</span></div>
            <p id="welcome-sub"></p>
          </div>
          <div class="welcome-actions">
            <a class="button button-secondary" href="preview-card.html" style="text-decoration:none"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye"/></svg>Preview card</a>
            <button class="button button-primary" id="share-btn"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-share"/></svg>Share invitation</button>
          </div>
        </section>

        <section class="stats-grid" aria-label="Wedding statistics">
      <section class="card stat-card featured">
        <div class="stat-label">Days until wedding</div>
        <div class="stat-bottom"><div class="stat-value" id="stat-days">0</div><div class="days-word" id="days-word">days</div></div>
        <div class="stat-note" id="stat-days-note"></div>
      </section>
      <section class="card stat-card">
        <div class="stat-label">Total guests</div>
        <div class="stat-bottom"><div class="stat-value" id="stat-guests">0</div></div>
        <div class="stat-note" id="stat-guests-note"></div>
      </section>
      <section class="card stat-card">
        <div class="stat-label">Attending</div>
        <div class="stat-bottom"><div class="stat-value" id="stat-attending">0</div></div>
        <div class="stat-note green" id="stat-attending-note"></div>
      </section>
      <section class="card stat-card">
        <div class="stat-label">Awaiting reply</div>
        <div class="stat-bottom"><div class="stat-value" id="stat-pending">0</div></div>
        <div class="stat-note gold" id="stat-pending-note"></div>
      </section>
      <section class="card stat-card">
        <div class="stat-label">Invitation views</div>
        <div class="stat-bottom"><div class="stat-value" id="stat-views">0</div></div>
        <div class="stat-note" id="stat-views-note"></div>
      </section>
      <section class="card stat-card">
        <div class="stat-label">Committee</div>
        <div class="stat-bottom"><div class="stat-value" id="stat-committee">0</div></div>
        <div class="stat-note" id="stat-committee-note"></div>
      </section>
        </section>

        <section class="card setup-card" id="setup-card">
          <div class="progress-ring" id="setup-ring"><div><strong id="setup-percent">0%</strong><small>complete</small></div></div>
          <div class="setup-copy">
            <span class="eyebrow">Your wedding space</span>
            <div role="heading" aria-level="2" class="heading heading-2" id="setup-title">You’re almost ready to share</div>
            <p id="setup-text"></p>
            <div class="progress-track" id="setup-track"><span></span></div>
          </div>
          <div class="setup-steps" id="setup-steps"></div>
          <a class="button button-primary" href="wedding-info.html" style="text-decoration:none">Continue setup<svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
        </section>

        <div class="dashboard-grid">
          <section class="card rsvp-card" id="rsvp-card">
            <div class="section-header">
              <div role="heading" aria-level="2" class="heading heading-2">RSVP overview</div>
              <a class="text-action" href="guests.html" style="text-decoration:none">View guests<svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
            </div>
            <div class="rsvp-content">
              <div class="donut" id="donut"><div><strong id="donut-total">0</strong><small>invited</small></div></div>
              <div class="legend">
                <div><span class="dot attending"></span><p>Attending<small id="lg-att-n"></small></p><strong id="lg-att-p"></strong></div>
                <div><span class="dot pending"></span><p>Pending<small id="lg-pen-n"></small></p><strong id="lg-pen-p"></strong></div>
                <div><span class="dot declined"></span><p>Declined<small id="lg-dec-n"></small></p><strong id="lg-dec-p"></strong></div>
              </div>
            </div>
            <div class="response-note"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-clock"/></svg><span><strong id="recent-responses">0 responses</strong> received in the last 7 days</span></div>
          </section>

          <section class="card activity-card" id="activity-card">
            <div class="section-header">
              <div role="heading" aria-level="2" class="heading heading-2">Recent guest activity</div>
              <a class="text-action" href="messages.html" style="text-decoration:none">See all activity<svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
            </div>
            <div class="activity-list" id="activity-list"></div>
          </section>

          <section class="card events-card" id="events-card">
            <div class="section-header">
              <div role="heading" aria-level="2" class="heading heading-2">Upcoming events</div>
              <a class="text-action" href="events.html" style="text-decoration:none">All events<svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
            </div>
            <div id="events-list"></div>
            <a class="button button-secondary" href="events.html" style="text-decoration:none"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>Add event</a>
          </section>

          <section class="card committee-card" id="committee-card">
            <div class="section-header">
              <div role="heading" aria-level="2" class="heading heading-2">Planning committee</div>
              <a class="text-action" href="committee.html" style="text-decoration:none">Manage<svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
            </div>
            <div class="member-stack" id="member-stack"></div>
            <p class="committee-copy"><strong id="committee-count">0 people</strong> are helping make the day special.</p>
            <div class="task-progress">
              <div><span>Tasks completed</span><strong id="tasks-text"></strong></div>
              <div class="progress-track" id="tasks-track"><span></span></div>
            </div>
            <div class="next-task" id="next-task" hidden><svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg><p><strong id="next-task-title"></strong><small id="next-task-meta"></small></p></div>
          </section>


          <section class="card announcement-card" id="announcement-card">
            <div class="section-header"><div role="heading" aria-level="2" class="heading heading-2">Announcements</div></div>
            <div id="announcement-list"></div>
            <a class="button button-secondary" href="announcements.html" style="text-decoration:none"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>New announcement</a>
          </section>

          <section class="card story-card" id="story-card">
            <img id="story-img" src="../assets/wedding-bg.jpg" alt="Wedding aisle">
            <div class="story-overlay">
              <span class="eyebrow">Photos &amp; story</span>
              <div role="heading" aria-level="2" class="heading heading-2">The beginning of us</div>
              <p>Share your favourite moments with the people you love.</p>
              <a class="story-link" href="story.html" style="text-decoration:none">Edit your story<svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
            </div>
          </section>
        </div>

        <!-- Shown by JS only when the wedding has no guests yet -->
        <div class="sample-set" id="empty-guests" hidden>
          <section class="card empty-state">
            <div class="empty-icon"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-users"/></svg></div>
            <div><div role="heading" aria-level="3" class="heading heading-3">No guests yet?</div><p>Add your first guest and start collecting RSVPs.</p></div>
            <a class="button button-secondary" href="guests.html" style="text-decoration:none"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>Add guest</a>
          </section>
        </div>

        <footer>WeddingHub <span>·</span> Made for your best day yet.</footer>
      </template>
  <script src="../app.js"></script>
  <script src="../api-client.js"></script>
  <script src="owner-shell.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
