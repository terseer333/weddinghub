services:
  - type: web
    name: weddinghub
    runtime: go
    buildCommand: python3 scripts/build_frontend.py && cd backend && go build -tags netgo -ldflags "-s -w" -o app ./cmd
    startCommand: cd backend && ./app
    healthCheckPath: /healthz
    envVars:
      - key: WEDDINGHUB_STATIC_DIR
        value: ../dist
      - key: WEDDINGHUB_ALLOWED_ORIGINS
        value: https://weddinghub.onrender.com
